{% extends "base.html" %}

{% block title %}{{ page.title }}{% endblock %}

{% block content %}
<article class="legal-page container">
    <header class="legal-header">
        <p class="eyebrow">Hijra</p>
        <h1>{{ page.title }}</h1>
        <p class="last-update">Last updated: {{ page.extra.last_updated }}</p>
    </header>

    <div class="legal-content">
        {{ page.content | safe }}
    </div>
</article>
{% endblock %}
