<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/png" href={{ get_url(path="favicon.png") }}>
        <link rel="stylesheet" href={{ get_url(path="style.css") }}>
        <title>{% block title %}{% endblock %} - Hijra</title>
    </head>
    <body>
        <header>
            <a href="/" id="logo-div">
                <img src={{ get_url(path="favicon.png") }} alt="Logo">
                Hijra
            </a>

            <nav>
                <a href="/privacy-policy">Privacy policy</a>
                <a href="/terms-of-use">Terms of use</a>
                <a href="https://github.com/doucaml/hijra-app">Github</a>
            </nav>
        </header>

        <main>
            {% block content %}{% endblock %}
        </main>

        <!--<footer>
            <p>Made with Zola</p>
        </footer>-->
    </body>
</html>
